<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BuBu & DuDu · Our Story</title>
  <meta name="description" content="A private journey of love, nostalgia, and a hidden surprise.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Playfair+Display:wght@500;700;900&family=Great+Vibes&family=Inter:wght@300;400;500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #0a070a;
      --midnight: #0d0710;
      --burgundy: #3a0d1c;
      --wine: #5c1327;
      --plum: #2b0f2e;
      --gold: #d4af6a;
      --gold-soft: #e9cd9a;
      --rose-gold: #e0b6ab;
      --ivory: #f4e9de;
      --pink: #e8a6b8;
      --serif: 'Playfair Display', 'Cormorant Garamond', Georgia, serif;
      --script: 'Great Vibes', cursive;
      --sans: 'Inter', 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --ease: cubic-bezier(.22,.68,0,1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--black); color: var(--ivory);
      font-family: var(--sans);
      overflow-x: hidden; width: 100%; min-height: 100vh; min-height: 100svh;
      position: relative;
    }
    img, video { max-width: 100%; display: block; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; border-radius: 4px; }
    h1, h2, h3 { font-family: var(--serif); font-weight: 700; letter-spacing: .01em; }
    .script { font-family: var(--script); }
    .eyebrow { font-family: var(--sans); letter-spacing: .3em; text-transform: uppercase; font-size: .65rem; color: var(--gold-soft); opacity: .85; }
    .tamil { color: var(--rose-gold); font-style: italic; }

    #particle-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; opacity: .9; }
    #cursor-glow {
      position: fixed; width: 26px; height: 26px; border-radius: 50%;
      border: 1px solid rgba(212,175,106,.6);
      box-shadow: 0 0 18px 4px rgba(212,175,106,.25);
      pointer-events: none; z-index: 9999; transform: translate(-50%,-50%);
      transition: width .2s var(--ease), height .2s var(--ease), opacity .2s; opacity: 0;
    }
    @media(hover:hover) and (pointer:fine) { #cursor-glow { opacity: 1; } }

    .glass {
      background: rgba(20,12,18,.45); border: 1px solid rgba(212,175,106,.22);
      backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
      border-radius: 20px; box-shadow: 0 20px 60px -20px rgba(0,0,0,.6);
    }
    .btn-gold {
      position: relative; display: inline-flex; align-items: center; gap: .6em;
      padding: 1em 2.2em; font-size: .85rem; letter-spacing: .12em; text-transform: uppercase;
      color: var(--midnight);
      background: linear-gradient(135deg, var(--gold-soft), var(--gold) 60%, var(--rose-gold));
      border-radius: 100px; font-weight: 600;
      box-shadow: 0 0 0 1px rgba(212,175,106,.5), 0 10px 30px -8px rgba(212,175,106,.55);
      transition: transform .35s var(--ease), box-shadow .35s var(--ease);
      min-height: 48px; min-width: 48px;
    }
    .btn-gold:hover { transform: translateY(-2px) scale(1.03); }
    .btn-ghost {
      padding: .9em 1.8em; border-radius: 100px; border: 1px solid rgba(212,175,106,.45);
      color: var(--gold-soft); font-size: .78rem; letter-spacing: .12em; text-transform: uppercase;
      background: rgba(255,255,255,.02); backdrop-filter: blur(6px); min-height: 44px;
      transition: all .3s var(--ease);
    }
    .btn-ghost:hover { background: rgba(212,175,106,.12); border-color: var(--gold); }

    /* LOCK SCREEN */
    #lock-screen {
      position: fixed; inset: 0; z-index: 3000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 6vh 6vw; text-align: center;
      background: radial-gradient(ellipse at 50% 20%, rgba(224,86,140,.2), transparent 60%), linear-gradient(160deg,var(--midnight),var(--black) 60%, var(--plum));
      transition: opacity .8s var(--ease), visibility .8s;
    }
    #lock-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .lock-hearts { display: flex; gap: .5rem; margin-bottom: 1.2rem; }
    .lock-hearts svg { width: 32px; height: 32px; fill: var(--pink); animation: heartbeat 1.6s ease-in-out infinite; }
    .lock-hearts svg:nth-child(2) { fill: var(--gold); animation-delay: .2s; }
    @keyframes heartbeat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
    .lock-title { font-size: clamp(1.5rem,6vw,2.4rem); margin-bottom: .4rem; background: linear-gradient(120deg,var(--pink),var(--gold-soft)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lock-sub { font-size: .85rem; color: var(--rose-gold); margin-bottom: 1.8rem; font-style: italic; }
    .pin-dots { display: flex; gap: 14px; margin-bottom: 1.6rem; }
    .pin-dot { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--rose-gold); transition: all .2s var(--ease); }
    .pin-dot.filled { background: var(--pink); border-color: var(--pink); transform: scale(1.15); }
    .pin-pad { display: grid; grid-template-columns: repeat(3,62px); gap: 12px; justify-content: center; }
    .pin-key {
      width: 62px; height: 62px; border-radius: 50%; background: rgba(255,255,255,.06);
      border: 1px solid rgba(212,175,106,.3); font-size: 1.2rem; font-weight: 500;
      display: flex; align-items: center; justify-content: center; transition: all .2s var(--ease);
    }
    .pin-key:active { background: var(--pink); transform: scale(.92); }
    .pin-key.wide { font-size: .8rem; }
    .lock-error { min-height: 1.3rem; margin-top: 1.1rem; color: #ff9e7d; font-size: .85rem; font-weight: 500; opacity: 0; }
    .lock-error.show { opacity: 1; animation: fadeUp .4s var(--ease); }

    /* LOADER */
    #loader { position: fixed; inset: 0; z-index: 10000; background: var(--black); display: flex; align-items: center; justify-content: center; transition: opacity 1s var(--ease), visibility 1s; }
    #loader.hide { opacity: 0; visibility: hidden; }
    .loader-heart { width: 14px; height: 14px; background: var(--gold); transform: rotate(45deg); position: relative; animation: pulseHeart 1.4s ease-in-out infinite; }
    .loader-heart::before,.loader-heart::after { content: ''; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--gold); }
    .loader-heart::before { left: -7px; top: 0; } .loader-heart::after { top: -7px; left: 0; }
    @keyframes pulseHeart { 0%,100% { transform: rotate(45deg) scale(1); opacity: .7; } 50% { transform: rotate(45deg) scale(1.3); opacity: 1; } }

    #app { display: none; position: relative; z-index: 5; }
    #app.visible { display: block; }

    #progress-bar-wrap {
      position: fixed; top: 0; left: 0; right: 0; z-index: 900; padding: .85rem 1.1rem;
      display: flex; align-items: center; gap: .7rem;
      background: linear-gradient(180deg, rgba(10,7,10,.85), transparent);
      pointer-events: none;
    }
    .progress-track { flex: 1; height: 6px; border-radius: 6px; background: rgba(255,255,255,.15); overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg,var(--pink),var(--gold)); border-radius: 6px; transition: width .6s var(--ease); }
    .progress-label { font-size: .62rem; letter-spacing: .06em; white-space: nowrap; color: var(--rose-gold); }

    .chapter {
      position: relative; min-height: 100vh; min-height: 100svh; width: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 9vh 6vw 6vh; text-align: center; overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(224,182,171,.08), transparent 60%),
        radial-gradient(ellipse at 50% 100%, rgba(212,175,106,.06), transparent 60%),
        linear-gradient(180deg, var(--midnight), var(--black) 60%, var(--plum));
    }
    .section-head { max-width: 640px; margin-bottom: 2.4rem; }
    .section-title { font-size: clamp(1.7rem,5vw,2.8rem); margin-bottom: .5rem; color: var(--ivory); }
    .section-sub { font-family: var(--serif); font-style: italic; color: var(--rose-gold); font-size: clamp(.9rem,2.2vw,1.1rem); }

    /* GIF cards */
    .gif-card {
      background: rgba(20,12,18,.35); border-radius: 24px; border: 1px solid rgba(212,175,106,.15);
      padding: 1.2rem; margin: 0.8rem 0; width: min(90vw, 420px);
      backdrop-filter: blur(8px);
      transition: transform .3s var(--ease);
    }
    .gif-card:hover { transform: scale(1.01); }
    .gif-card img { border-radius: 16px; width: 100%; aspect-ratio: 1/1; object-fit: cover; background: var(--plum); }

    /* beats */
    .beats { display: flex; flex-direction: column; gap: 1.4rem; width: 100%; max-width: 560px; margin: 1.6rem 0; }
    .beat { padding: 1.2rem 1.3rem; text-align: left; opacity: 0; transform: translateY(24px); transition: opacity .8s var(--ease), transform .8s var(--ease); background: rgba(20,12,18,.3); border-radius: 20px; border: 1px solid rgba(212,175,106,.1); }
    .beat.show { opacity: 1; transform: translateY(0); }
    .beat-icon { font-size: 1.25rem; margin-bottom: .35rem; }
    .beat-label { font-size: .65rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-soft); margin-bottom: .3rem; }
    .beat-text { font-size: .92rem; line-height: 1.6; }

    /* ticket */
    .ticket-wrap { perspective: 1200px; margin: 1.6rem 0; }
    .ticket {
      width: min(88vw,380px); background: linear-gradient(160deg,#fff,#ffe9ef); color: #3a1740;
      border-radius: 16px; overflow: hidden; box-shadow: 0 30px 60px -16px rgba(0,0,0,.5);
      transform: scale(.92); opacity: 0; transition: transform 1s var(--ease), opacity 1s var(--ease);
    }
    .ticket.show { opacity: 1; transform: scale(1); }
    .ticket-top { padding: 1.1rem 1.2rem; background: linear-gradient(135deg,var(--pink),var(--wine)); color: #fff; text-align: left; }
    .ticket-movie { font-family: var(--serif); font-size: 1.25rem; font-weight: 700; }
    .ticket-sub { font-size: .68rem; opacity: .9; letter-spacing: .05em; margin-top: .2rem; }
    .ticket-perf { display: flex; justify-content: space-between; align-items: center; padding: .75rem 1.2rem; border-bottom: 2px dashed rgba(58,23,64,.25); }
    .ticket-detail { text-align: left; }
    .ticket-detail .label { font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; opacity: .55; }
    .ticket-detail .value { font-weight: 600; font-size: .88rem; }
    .ticket-stub { display: flex; justify-content: space-between; align-items: center; padding: .9rem 1.2rem; }
    .ticket-barcode { height: 28px; background: repeating-linear-gradient(90deg,#3a1740 0 2px,transparent 2px 5px); opacity: .6; border-radius: 2px; margin: 0 1.2rem 1rem; }

    /* memories */
    .timeline { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 2rem; }
    .mem-card {
      display: grid; grid-template-columns: 170px 1fr; gap: 1.4rem; align-items: center;
      padding: 1.2rem; text-align: left; opacity: 0; transform: translateY(36px) rotateX(6deg);
      transition: opacity .9s var(--ease), transform .9s var(--ease);
      background: rgba(20,12,18,.3); border-radius: 20px; border: 1px solid rgba(212,175,106,.1);
    }
    .mem-card.in-view { opacity: 1; transform: translateY(0) rotateX(0); }
    .mem-card:nth-child(even) { grid-template-columns: 1fr 170px; }
    .mem-card:nth-child(even) .mem-img { order: 2; }
    .mem-img {
      width: 100%; aspect-ratio: 1/1; border-radius: 14px; overflow: hidden;
      border: 1px solid rgba(212,175,106,.3); box-shadow: 0 18px 34px -14px rgba(0,0,0,.6);
      position: relative; background: linear-gradient(135deg, var(--wine), var(--plum));
    }
    .mem-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s var(--ease); }
    .mem-card:hover .mem-img img { transform: scale(1.08); }
    .mem-date { font-size: .65rem; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-soft); opacity: .85; }
    .mem-title { font-family: var(--serif); font-size: clamp(1.1rem,2.6vw,1.4rem); margin: .3rem 0 .45rem; color: var(--ivory); }
    .mem-desc { font-size: .88rem; line-height: 1.55; color: rgba(244,233,222,.82); }
    @media(max-width:680px) {
      .mem-card, .mem-card:nth-child(even) { grid-template-columns: 1fr; text-align: center; }
      .mem-card:nth-child(even) .mem-img { order: 0; }
      .mem-img { max-width: 220px; margin: 0 auto; }
    }

    /* keep */
    .keep-line1, .keep-line2 { font-family: var(--serif); font-size: clamp(1.4rem,4.4vw,2.3rem); max-width: 680px; opacity: 0; }
    .keep-line1.show { animation: fadeUp 1.4s var(--ease) forwards; }
    .keep-line2.show { animation: fadeUp 1.6s var(--ease) forwards; }
    .keep-tamil { margin-top: 1.4rem; font-size: clamp(.9rem,2.2vw,1.1rem); opacity: 0; }
    .keep-tamil.show { animation: fadeUp 1.6s var(--ease) forwards; }
    .glow-behind { position: absolute; width: 60vw; height: 60vw; max-width: 600px; max-height: 600px; background: radial-gradient(circle, rgba(212,175,106,.16), transparent 70%); z-index: -1; animation: pulseGlow 6s ease-in-out infinite; }
    @keyframes pulseGlow { 0%,100% { opacity: .5; transform: scale(1); } 50% { opacity: .9; transform: scale(1.15); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    /* letter */
    .letter-frame { width: min(92vw,600px); padding: clamp(1.5rem,4vw,2.6rem); position: relative; }
    .letter-closed { cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1rem; padding: 2.6rem 1.4rem; }
    .letter-icon { font-size: 1.9rem; color: var(--gold); }
    .letter-body { display: none; text-align: left; font-family: var(--serif); font-size: clamp(.92rem,2vw,1.05rem); line-height: 1.8; color: var(--ivory); white-space: pre-wrap; }
    .letter-body.active { display: block; }
    .letter-cursor { display: inline-block; width: 2px; background: var(--gold); animation: blink 1s step-start infinite; margin-left: 2px; }
    @keyframes blink { 50% { opacity: 0; } }

    /* reveal (safe, no surprise content) */
    .reveal-spark { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 40px 12px rgba(212,175,106,.8); margin-bottom: 1.8rem; opacity: 0; }
    .reveal-spark.show { animation: fadeUp 1.2s var(--ease) forwards; }
    .reveal-ready { font-family: var(--serif); font-style: italic; font-size: 1.15rem; color: var(--rose-gold); opacity: 0; }
    .reveal-ready.show { animation: fadeUp 1.2s var(--ease) .3s forwards; }
    .reveal-main { font-size: clamp(2rem,8vw,4.4rem); margin: 1.2rem 0; background: linear-gradient(120deg,var(--gold-soft),var(--gold),var(--rose-gold)); -webkit-background-clip: text; background-clip: text; color: transparent; opacity: 0; }
    .reveal-main.show { animation: fadeUp 1.4s var(--ease) .6s forwards; }
    .reveal-sub { font-family: var(--serif); font-style: italic; font-size: clamp(1rem,2.5vw,1.3rem); color: var(--ivory); opacity: 0; max-width: 600px; }
    .reveal-sub.show { animation: fadeUp 1.4s var(--ease) .9s forwards; }
    .reveal-date { margin-top: 1.5rem; font-size: .8rem; letter-spacing: .32em; text-transform: uppercase; color: var(--gold-soft); opacity: 0; }
    .reveal-date.show { animation: fadeUp 1.4s var(--ease) 1.2s forwards; }

    /* cake */
    .cake-scene { perspective: 900px; margin: 1.6rem 0; }
    .cake { position: relative; width: 190px; transform-style: preserve-3d; }
    .cake-tier { width: 100%; height: 56px; background: linear-gradient(160deg,#3a1420,#230a13); border: 1px solid rgba(212,175,106,.4); border-radius: 8px; position: relative; box-shadow: inset 0 -10px 18px rgba(0,0,0,.4); }
    .cake-tier.top { width: 70%; margin: 0 auto; height: 44px; }
    .cake-tier::after { content: ''; position: absolute; top: -6px; left: 0; width: 100%; height: 13px; background: linear-gradient(90deg,var(--gold-soft),var(--gold)); border-radius: 6px; opacity: .85; }
    .candle-row { display: flex; justify-content: center; gap: 13px; margin-top: 7px; }
    .candle { width: 5px; height: 24px; background: linear-gradient(var(--ivory),var(--gold-soft)); border-radius: 2px; position: relative; }
    .flame { position: absolute; top: -13px; left: 50%; transform: translateX(-50%); width: 8px; height: 13px; border-radius: 50% 50% 50% 50%/60% 60% 40% 40%; background: radial-gradient(circle at 50% 70%,#fff2c4,#f6a93b 60%,#d94f1f); animation: flicker 1.4s ease-in-out infinite; box-shadow: 0 0 10px 3px rgba(246,169,59,.6); }
    .candle.blown .flame { opacity: 0; }
    @keyframes flicker { 0%,100% { transform: translateX(-50%) scaleY(1); } 50% { transform: translateX(-50%) scaleY(1.15) rotate(2deg); } }
    .wish-text { margin-top: 1.4rem; font-family: var(--serif); font-style: italic; color: var(--rose-gold); }
    .cake-buttons { display: flex; gap: .7rem; flex-wrap: wrap; justify-content: center; margin-top: 1.4rem; }

    /* planner (simple, no spoilers) */
    .planner-form {
      width: min(96vw, 500px);
      display: flex; flex-direction: column; gap: 1.2rem;
      margin: 1.6rem 0; padding: 1.6rem;
    }
    .form-group { text-align: left; display: flex; flex-direction: column; gap: 0.3rem; }
    .form-group label { font-size: .8rem; letter-spacing: .06em; color: var(--gold-soft); }
    .form-group select, .form-group input {
      background: rgba(255,255,255,.06); border: 1px solid rgba(212,175,106,.25);
      border-radius: 14px; padding: 0.8rem 1rem;
      color: var(--ivory); font-size: .95rem;
      font-family: var(--sans);
      transition: border .3s;
    }
    .form-group select:focus, .form-group input:focus {
      outline: none; border-color: var(--gold);
    }
    .form-group select option { background: var(--midnight); color: var(--ivory); }

    .planner-output { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; width: min(96vw, 540px); margin: 1rem 0; }
    .planner-item { background: rgba(20,12,18,.4); border-radius: 18px; padding: 0.8rem; border: 1px solid rgba(212,175,106,.15); text-align: left; }
    .planner-item .time { font-size: .65rem; letter-spacing: .08em; color: var(--gold-soft); opacity: .8; }
    .planner-item .place { font-weight: 600; font-size: .9rem; margin: .2rem 0; }
    .planner-item .note { font-size: .75rem; opacity: .75; }

    /* hold heart */
    .hold-heart-wrap { display: flex; flex-direction: column; align-items: center; gap: 1rem; margin-top: 2.2rem; }
    .hold-heart { position: relative; width: 104px; height: 104px; display: flex; align-items: center; justify-content: center; }
    .hold-heart svg.heart-shape { width: 70px; height: 70px; fill: var(--pink); position: relative; z-index: 2; transition: transform .15s; filter: drop-shadow(0 0 18px rgba(232,166,184,.5)); }
    .hold-progress-ring { position: absolute; inset: 0; transform: rotate(-90deg); }
    .hold-progress-ring circle { fill: none; stroke-width: 5; stroke: rgba(255,255,255,.18); }
    .hold-progress-ring circle.fill { stroke: var(--gold); stroke-dasharray: 295; stroke-dashoffset: 295; transition: stroke-dashoffset .05s linear; }
    .hold-heart.active svg.heart-shape { transform: scale(1.15); }
    .hold-hint { font-size: .72rem; letter-spacing: .06em; color: var(--rose-gold); }

    .completed-flash { position: fixed; inset: 0; z-index: 3500; background: radial-gradient(circle at 50% 50%, rgba(255,143,171,.3), rgba(10,7,10,.97) 70%); display: none; align-items: center; justify-content: center; flex-direction: column; gap: .9rem; text-align: center; padding: 6vh 6vw; }
    .completed-flash.active { display: flex; }
    .completed-flash .cf-title { font-size: clamp(1.5rem,6vw,2.2rem); }
    .completed-flash .cf-sub { color: var(--rose-gold); font-style: italic; }

    #music-player { position: fixed; bottom: 16px; left: 16px; z-index: 600; display: flex; align-items: center; gap: .6rem; padding: .5rem .75rem; border-radius: 100px; background: rgba(20,12,18,.45); border: 1px solid rgba(212,175,106,.22); backdrop-filter: blur(14px); }
    #music-toggle { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg,var(--gold-soft),var(--gold)); color: var(--midnight); display: flex; align-items: center; justify-content: center; font-size: .8rem; flex-shrink: 0; }
    .visualizer { display: flex; align-items: flex-end; gap: 2px; height: 15px; }
    .visualizer span { width: 2px; background: var(--gold-soft); border-radius: 2px; height: 4px; transition: height .2s; }
    #music-player.playing .visualizer span { animation: bar 1s ease-in-out infinite; }
    .visualizer span:nth-child(1) { animation-delay: 0s; } .visualizer span:nth-child(2) { animation-delay: .15s; } .visualizer span:nth-child(3) { animation-delay: .3s; } .visualizer span:nth-child(4) { animation-delay: .45s; }
    @keyframes bar { 0%,100% { height: 4px; } 50% { height: 14px; } }
    #music-vol { width: 56px; accent-color: var(--gold); }
    @media(max-width:520px) { #music-vol { display: none; } }

    #secret-heart { position: fixed; bottom: 16px; right: 16px; z-index: 600; width: 20px; height: 20px; opacity: .26; transition: opacity .3s,transform .3s; }
    #secret-heart:hover { opacity: .6; transform: scale(1.2); }
    #secret-heart svg { width: 100%; height: 100%; fill: var(--pink); }

];

// ===== STATE =====
function loadState(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return { unlocked:1, completed:[], authed:false, currentIndex:0 };
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
let state = loadState();

const $ = (sel, ctx) => (ctx||document).querySelector(sel);
const $$ = (sel, ctx) => Array.from((ctx||document).querySelectorAll(sel));
function isUnlocked(i){ return i < state.unlocked; }
function isCompleted(id){ return state.completed.includes(id); }

// ===== LOADER =====
window.addEventListener('load', () => { setTimeout(() => $('#loader').classList.add('hide'), 700); });
setTimeout(() => { $('#loader').classList.add('hide'); }, 3000);

// ===== PARTICLES =====
const canvas = $('#particle-canvas');
const ctx2d = canvas.getContext('2d');
let particles = [];
let dpr = Math.min(window.devicePixelRatio || 1, 2);
function resizeCanvas(){
  canvas.width = innerWidth*dpr; canvas.height = innerHeight*dpr;
  canvas.style.width = innerWidth+'px'; canvas.style.height = innerHeight+'px';
  ctx2d.setTransform(dpr,0,0,dpr,0,0);
}
resizeCanvas(); addEventListener('resize', resizeCanvas);
const isLowPower = navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4;
const baseCount = CONFIG.reducedMotion ? 0 : (isLowPower || innerWidth < 600 ? 26 : 55);
function makeParticle(type, burst){
  const w = innerWidth, h = innerHeight;
  return {
    type: type || 'star',
    x: burst ? w/2+(Math.random()-0.5)*90 : Math.random()*w,
    y: burst ? h/2+(Math.random()-0.5)*90 : Math.random()*h,
    vx: burst ? (Math.random()-0.5)*3 : (Math.random()-0.5)*0.14,
    vy: burst ? -Math.random()*3-0.5 : Math.random()*0.14+0.03,
    size: type === 'heart' ? Math.random()*6+4 : Math.random()*2+0.6,
    decay: burst ? (Math.random()*0.008+0.004) : 0, life:1,
    twinkle: Math.random()*Math.PI*2
  };
}
for(let i=0;i<baseCount;i++) particles.push(makeParticle(Math.random()<0.08?'gold':'star'));
function spawnBurst(type,count){ if(CONFIG.reducedMotion) return; for(let i=0;i<count;i++) particles.push(makeParticle(type,true)); }
function drawHeart(x,y,size,alpha,color){
  ctx2d.save(); ctx2d.translate(x,y); ctx2d.scale(size/10,size/10);
  ctx2d.beginPath();
  ctx2d.moveTo(0,3);
  ctx2d.bezierCurveTo(0,-2,-6,-2,-6,2);
  ctx2d.bezierCurveTo(-6,6,0,8,0,11);
  ctx2d.bezierCurveTo(0,8,6,6,6,2);
  ctx2d.bezierCurveTo(6,-2,0,-2,0,3);
  ctx2d.closePath(); ctx2d.fillStyle=color; ctx2d.globalAlpha=alpha; ctx2d.fill(); ctx2d.restore();
}
function animateParticles(){
  ctx2d.clearRect(0,0,innerWidth,innerHeight);
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.twinkle+=0.02;
    if(p.decay) p.life -= p.decay;
    else if(p.y > innerHeight) { p.y=-4; p.x=Math.random()*innerWidth; }
    const alpha = p.decay ? Math.max(p.life,0) : (Math.sin(p.twinkle)*0.3+0.6);
    if(p.type==='heart') drawHeart(p.x,p.y,p.size,alpha,'rgba(232,166,184,1)');
    else if(p.type==='gold'){ ctx2d.beginPath(); ctx2d.fillStyle=`rgba(212,175,106,${alpha})`; ctx2d.arc(p.x,p.y,p.size,0,Math.PI*2); ctx2d.fill(); }
    else { ctx2d.beginPath(); ctx2d.fillStyle=`rgba(244,233,222,${alpha})`; ctx2d.arc(p.x,p.y,p.size,0,Math.PI*2); ctx2d.fill(); }
  });
  particles = particles.filter(p => !p.decay || p.life>0);
  requestAnimationFrame(animateParticles);
}
requestAnimationFrame(animateParticles);

// ===== CURSOR GLOW =====
if(window.matchMedia('(hover:hover) and (pointer:fine)').matches){
  const glow = $('#cursor-glow');
  addEventListener('mousemove', e => { glow.style.left=e.clientX+'px'; glow.style.top=e.clientY+'px'; });
}

// ===== SOUND =====
const SoundManager = (() => {
  let actx;
  function ensure(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
  function tone(freq,dur,type,vol){
    const ac = ensure(); if(!ac) return;
    const osc = ac.createOscillator(), gain = ac.createGain();
    osc.type = type||'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol||0.05, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
    osc.connect(gain).connect(ac.destination); osc.start(); osc.stop(ac.currentTime+dur);
  }
  return {
    click: () => tone(660,.12,'sine',.04),
    whoosh: () => tone(220,.35,'sine',.03),
    reveal: () => { tone(523,.4,'sine',.05); setTimeout(()=>tone(784,.5,'sine',.05),150); }
  };
})();

$('#pin-clear').addEventListener('click', ()=>{ pin=''; renderPin(); });

addEventListener('pageshow', ()=>{

// ===== APP RENDER =====
const root = $('#chapter-root');

function updateProgressBar(){

function openChapter(i){

// ===== HOLD HEART =====
function mountHoldHeart(ch, i, container, hintText){
  const already = isCompleted(ch.id);
  const isLast = i === CHAPTERS.length - 1;
  if(already){
    container.innerHTML = `<div class="hold-heart-wrap"><p class="hold-hint" style="color:#4bc98a;">Memory kept forever ✓</p></div>`;
    return;
  }
  container.innerHTML = `
    <div class="hold-heart-wrap">
      <div class="hold-heart" id="hold-heart-${ch.id}" role="button" tabindex="0" aria-label="Hold to keep this memory">
        <svg class="hold-progress-ring" viewBox="0 0 104 104"><circle cx="52" cy="52" r="47"></circle><circle class="fill" cx="52" cy="52" r="47"></circle></svg>
        <svg class="heart-shape" viewBox="0 0 32 32"><path d="M16 29S3 20.5 3 12.3C3 7.7 6.7 4 11.2 4c2.6 0 5 1.3 6.5 3.3C19.2 5.3 21.6 4 24.2 4 28.7 4 32 7.7 32 12.3 32 20.5 19 29 16 29z"/></svg>
      </div>
      <p class="hold-hint">${hintText || (isLast ? 'Hold to complete our story ❤️' : 'Hold to keep this memory ❤️')}</p>
    </div>
  `;
  const holdEl = $(`#hold-heart-${ch.id}`, container);
  const ring = holdEl.querySelector('.fill');
  const circumference = 2*Math.PI*47;
  ring.style.strokeDasharray = circumference;
  ring.style.strokeDashoffset = circumference;
  let progressRAF = null, startTime = null;
  const HOLD_MS = 1600;
  function startHold(e){
    if(e) e.preventDefault();
    holdEl.classList.add('active');
    startTime = performance.now();
    step();
  }
  function step(){
    const elapsed = performance.now()-startTime;
    const pct = Math.min(elapsed/HOLD_MS, 1);
    ring.style.strokeDashoffset = circumference*(1-pct);
    if(pct >= 1){ completeAndAdvance(ch, i); return; }
    progressRAF = requestAnimationFrame(step);
  }
  function cancelHold(){
    holdEl.classList.remove('active');
    cancelAnimationFrame(progressRAF);
    ring.style.strokeDashoffset = circumference;
  }
  holdEl.addEventListener('mousedown', startHold);
  holdEl.addEventListener('touchstart', startHold, {passive:false});
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev => holdEl.addEventListener(ev, cancelHold));
  holdEl.addEventListener('keydown', (e)=>{ if((e.key==='Enter'||e.key===' ') && !holdEl.classList.contains('active')) startHold(e); });
  holdEl.addEventListener('keyup', cancelHold);
}

function completeAndAdvance(ch, i){
  if(!isCompleted(ch.id)) state.completed.push(ch.id);
  const nextIndex = Math.min(i+1, CHAPTERS.length);
  state.unlocked = Math.max(state.unlocked, Math.min(i+2, CHAPTERS.length));
  saveState();
  updateProgressBar();
  spawnBurst('gold', 26);
  spawnBurst('heart', 16);
  SoundManager.reveal();

  const isLast = i === CHAPTERS.length - 1;
  const flash = $('#completed-flash');
  $('#cf-title').textContent = isLast ? 'Our Story, Kept Forever ❤️' : 'Memory Kept Forever';
  $('#cf-sub').textContent = isLast ? 'Thank you for reading it all.' : `Unlocking: ${CHAPTERS[i+1] ? CHAPTERS[i+1].title : ''}…`;
  flash.classList.add('active');
  setTimeout(()=>{
    flash.classList.remove('active');
    if(!isLast) openChapter(i+1);
  }, 1300);

let countdownTimer;
function runCountdown(){
  clearInterval(countdownTimer);
  const target = new Date(CONFIG.birthday).getTime();
  function tick(){
    const diff = target - Date.now();
    if(diff <= 0){
      const t = $('#cd-tagline'); if(t) t.textContent = 'Your special day is here ❤️';
      ['cd-days','cd-hours','cd-min','cd-sec'].forEach(id=>{ const e=$('#'+id); if(e) e.textContent='00'; });
      clearInterval(countdownTimer); return;
    }
    const d=Math.floor(diff/864e5), h=Math.floor(diff/36e5)%24, m=Math.floor(diff/6e4)%60, s=Math.floor(diff/1000)%60;
    const set=(id,v)=>{ const e=$('#'+id); if(e) e.textContent=String(v).padStart(2,'0'); };
    set('cd-days',d); set('cd-hours',h); set('cd-min',m); set('cd-sec',s);
  }
  tick(); countdownTimer = setInterval(tick, 1000);
}

function typewrite(text, el, onDone){
  if(CONFIG.reducedMotion){ el.textContent = text; if(onDone) onDone(); return; }
  el.textContent = '';
  const cursor = document.createElement('span'); cursor.className='letter-cursor'; cursor.innerHTML='&nbsp;';
  let idx = 0; const speed = 12;
  function step(){
    if(idx <= text.length){ el.textContent = text.slice(0,idx); el.appendChild(cursor); idx += 2; requestAnimationFrame(()=>setTimeout(step, speed)); }
    else{ cursor.remove(); if(onDone) onDone(); }
  }
  step();
}

function renderLightboxItem(idx){
  const item = galleryItems[idx];
  lightboxContent.innerHTML = `<img src="${item.src}" alt="" style="max-width:min(90vw,700px);max-height:80vh;border-radius:10px;box-shadow:0 30px 60px rgba(0,0,0,.7);">`;
}
function openLightbox(i){ lbIndex = i; renderLightboxItem(i); lightbox.style.display='flex'; $('#lightbox-close').focus(); }
function closeLightbox(){ lightbox.style.display='none'; lightboxContent.innerHTML=''; }
$('#lightbox-close').addEventListener('click', closeLightbox);
$('#lightbox-prev').addEventListener('click', ()=>{ lbIndex=(lbIndex-1+galleryItems.length)%galleryItems.length; renderLightboxItem(lbIndex); });
$('#lightbox-next').addEventListener('click', ()=>{ lbIndex=(lbIndex+1)%galleryItems.length; renderLightboxItem(lbIndex); });
lightbox.addEventListener('click', (e)=>{ if(e.target===lightbox) closeLightbox(); });
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape'){ if(lightbox.style.display==='flex') closeLightbox(); if($('#secret-modal').style.display==='flex') closeSecret(); }
  if(lightbox.style.display==='flex'){ if(e.key==='ArrowRight') $('#lightbox-next').click(); if(e.key==='ArrowLeft') $('#lightbox-prev').click(); }
});

function renderForeverChapter(ch, i){
  const completedTitles = CHAPTERS.filter(c => isCompleted(c.id) && c.type !== 'forever').map(c => c.title);
  chapterShell(`
    <p class="eyebrow">Our Forever</p>
    <h2 class="script" style="font-size:clamp(1.8rem,6vw,3rem);margin:.5rem 0;">Our Forever ❤️</h2>
    <div class="forever-timeline">
      ${completedTitles.map(t=>`<div class="forever-item"><span class="fi-icon">✨</span><span class="fi-text">${t}</span></div>`).join('') || '<div class="forever-item"><span class="fi-icon">✨</span><span class="fi-text">Our timeline will fill in as chapters are completed.</span></div>'}
    </div>
    <p class="forever-final">4 years. 1,461 days. And I'd still choose you every single time. ❤️</p>
    <p class="end-fade">Made with love in Coimbatore · forever yours, DuDu</p>
    <button class="btn-gold" id="replay-btn" type="button">Replay Our Story ↻</button>
  `);
  spawnBurst('gold', 40); spawnBurst('heart', 24);
  if(!isCompleted(ch.id)){ state.completed.push(ch.id); saveState(); updateProgressBar(); }
  $('#replay-btn').addEventListener('click', () => {
    state = { unlocked:1, completed:[], authed:true, currentIndex:0 };
    saveState();
    $('#bg-audio').pause();
    $('#music-toggle').textContent = '▶';
    $('#music-player').classList.remove('playing');
    updateProgressBar();
    openChapter(0);
  });
}

// ===== MUSIC =====
const audio = $('#bg-audio');
const musicToggle = $('#music-toggle');
const musicPlayer = $('#music-player');
const musicVol = $('#music-vol');
audio.volume = parseFloat(musicVol.value);
musicToggle.addEventListener('click', () => {
  if(!CONFIG.music){ musicToggle.textContent='♪'; musicToggle.setAttribute('title','Add your song via CONFIG.music to enable playback'); return; }
  if(audio.paused){ audio.play().catch(()=>{}); musicToggle.textContent='❚❚'; musicToggle.setAttribute('aria-pressed','true'); musicPlayer.classList.add('playing'); }
  else{ audio.pause(); musicToggle.textContent='▶'; musicToggle.setAttribute('aria-pressed','false'); musicPlayer.classList.remove('playing'); }
});
musicVol.addEventListener('input', () => { audio.volume = parseFloat(musicVol.value); });

// ===== SECRET =====
let secretTaps = 0;
const secretModal = $('#secret-modal');
$('#secret-heart').addEventListener('click', () => {
  secretTaps++;
  if(secretTaps >= 5){ secretTaps = 0; secretModal.style.display='flex'; spawnBurst('heart', 18); $('#secret-close').focus(); }
});
function closeSecret(){ secretModal.style.display='none'; }
$('#secret-close').addEventListener('click', closeSecret);
secretModal.addEventListener('click', (e)=>{ if(e.target===secretModal) closeSecret(); });

})();
</script>
